<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CNNver2 — Arquitectura Visual</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #07090f;
  font-family: 'IBM Plex Mono', monospace;
  color: #c9d1e0;
  overflow-x: hidden;
}
svg {
  display: block;
  width: 100%;
  height: auto;
}
.label-mono { font-family: 'IBM Plex Mono', monospace; }

/* Tooltip */
#tt {
  position: fixed;
  background: #0d1117;
  border: 1px solid #00e5ff66;
  border-radius: 6px;
  padding: 10px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  line-height: 1.7;
  pointer-events: none;
  display: none;
  z-index: 100;
  max-width: 260px;
  color: #c9d1e0;
  box-shadow: 0 4px 24px #00000088;
}
#tt .tt-h { color: #00e5ff; font-weight: 600; margin-bottom: 4px; }

/* legend */
.legend {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #0d1117ee;
  border: 1px solid #1e2530;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 11px;
  line-height: 2;
}
.legend-dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:8px; vertical-align:middle; }
</style>
</head>
<body>
<div id="tt"></div>

<svg id="main" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Gradientes de fondo para cada módulo -->
  <linearGradient id="g-top" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1628"/>
    <stop offset="100%" stop-color="#060e1c"/>
  </linearGradient>
  <linearGradient id="g-comm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1a14"/>
    <stop offset="100%" stop-color="#060f0c"/>
  </linearGradient>
  <linearGradient id="g-proc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#15091a"/>
    <stop offset="100%" stop-color="#0c0610"/>
  </linearGradient>
  <linearGradient id="g-ctrl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0f06"/>
    <stop offset="100%" stop-color="#110a04"/>
  </linearGradient>
  <linearGradient id="g-cnn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#061520"/>
    <stop offset="100%" stop-color="#040d14"/>
  </linearGradient>
  <linearGradient id="g-mux" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0a18"/>
    <stop offset="100%" stop-color="#120712"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Arrow markers -->
  <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#00e5ff"/>
  </marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#ff8c42"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#c77dff"/>
  </marker>
  <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#ffd60a"/>
  </marker>
</defs>

<rect width="1400" height="920" fill="#07090f"/>

<!-- Título -->
<text x="700" y="38" text-anchor="middle" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#00e5ff" letter-spacing="2">CNNver2 — Arquitectura de Sistema</text>
<text x="700" y="58" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#4a5568">10×10 imagen · 5×5 kernel · clasificación binaria · 50 MHz SPI</text>

<text x="52" y="107" font-family="IBM Plex Mono" font-size="10" fill="#2a4a6a">8 pines externos · clock compartido SPI/CNN · reset global</text>

<!-- ══════════════════════════════════════════════════════════════
     BLOQUE: comm_mem_top
═══════════════════════════════════════════════════════════════ -->
<rect id="b-comm" x="130" y="120" width="480" height="530" rx="10"
      fill="url(#g-comm)" stroke="#1a4a30" stroke-width="1.5"

<text x="152" y="142" font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="#4ade80" letter-spacing="1">comm_mem_top</text>
<text x="152" y="157" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">Comunicación SPI + Memoria de registros</text>

<!-- ── spi_cnn_slave_8 ── -->
<rect id="b-spi" x="150" y="168" width="200" height="130" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1"
      class="clickable" style="cursor:pointer"/>
<text x="160" y="185" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#4ade80">spi_cnn_slave_8</text>
<text x="160" y="198" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">SPI slave · decodifica CMD</text>
<!-- Entradas dentro del bloque SPI -->
<text x="160" y="216" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">in: MOSI, CLK, SS_N</text>
<text x="160" y="228" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: MISO, cmd[2:0]</text>
<text x="160" y="240" font-family="IBM Plex Mono" font-size="8" fill="#ff8c42">out: load_img, load_wgt</text>
<text x="160" y="252" font-family="IBM Plex Mono" font-size="8" fill="#ff8c42">out: start_cnn</text>
<text x="160" y="265" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">out: image_mem[0..9]</text>
<text x="160" y="277" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">out: weight_mem[0..4]</text>
<text x="160" y="289" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">  3b CMD + payload</text>

<!-- ── SM IMAGE LOADER ── -->
<rect id="b-smiml" x="370" y="168" width="220" height="58" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="380" y="185" font-family="IBM Plex Mono" font-size="9" font-weight="600" fill="#4ade80">SC_SM_IMAGE_LOADER</text>
<text x="380" y="197" font-family="IBM Plex Mono" font-size="8" fill="#2a6a45">FSM carga imagen SPI</text>
<text x="380" y="210" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">10 filas · 30b/fila</text>
<text x="380" y="220" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">cmd 001</text>

<!-- ── SM WEIGHT LOADER ── -->
<rect id="b-smwgt" x="370" y="238" width="220" height="58" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="380" y="255" font-family="IBM Plex Mono" font-size="9" font-weight="600" fill="#4ade80">SC_SM_WEIGHT_LOADER</text>
<text x="380" y="267" font-family="IBM Plex Mono" font-size="8" fill="#2a6a45">FSM carga pesos SPI</text>
<text x="380" y="279" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">5 filas · 15b/fila</text>
<text x="380" y="290" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">cmd 010</text>

<!-- ── Register_Imag × 10 ── -->
<rect id="b-rimg" x="150" y="320" width="200" height="100" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="160" y="337" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#4ade80">Register_Imag × 10</text>
<text x="160" y="349" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">10 registros de 30 bits</text>
<text x="160" y="363" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">img_row00..09</text>
<text x="160" y="375" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">10 × 30b = 300b total</text>
<text x="160" y="387" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">clk: SPI_Clk</text>
<text x="160" y="399" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">→ i_img_row (proc)</text>
<text x="160" y="411" font-family="IBM Plex Mono" font-size="8" fill="#ff6b6b">rst: síncrono</text>

<!-- ── Register_Weight × 5 ── -->
<rect id="b-rwgt" x="370" y="320" width="220" height="100" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="380" y="337" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#4ade80">Register_Weight × 5</text>
<text x="380" y="349" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">5 registros de 15 bits</text>
<text x="380" y="363" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">wgt_row00..04</text>
<text x="380" y="375" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">5 × 15b = 75b total</text>
<text x="380" y="387" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">clk: SPI_Clk</text>
<text x="380" y="399" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">→ i_wgt_row (proc)</text>
<text x="380" y="411" font-family="IBM Plex Mono" font-size="8" fill="#ff6b6b">rst: síncrono</text>

<!-- ── Master Register MR1 ── -->
<rect id="b-mr1" x="150" y="445" width="200" height="75" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="160" y="462" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#ffd60a">Master_register MR1</text>
<text x="160" y="474" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">Resultado kernel0 (acc0)</text>
<text x="160" y="486" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">16 bits signed</text>
<text x="160" y="498" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">carga con mr1_load↓</text>
<text x="160" y="510" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">→ MISO (cmd 101)</text>

<!-- ── Master Register MR2 ── -->
<rect id="b-mr2" x="370" y="445" width="220" height="75" rx="7"
      fill="#061a10" stroke="#1a5a30" stroke-width="1" style="cursor:pointer"/>
<text x="380" y="462" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#ffd60a">Master_register MR2</text>
<text x="380" y="474" font-family="IBM Plex Mono" font-size="9" fill="#2a6a45">Resultado kernel1 (acc1)</text>
<text x="380" y="486" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">16 bits signed</text>
<text x="380" y="498" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">carga con mr2_load↓</text>
<text x="380" y="510" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">→ MISO (cmd 110)</text>

<!-- ══════════════════════════════════════════════════════════════
     BLOQUE: cnn_proc_top
═══════════════════════════════════════════════════════════════ -->
<rect id="b-proc" x="640" y="120" width="710" height="530" rx="10"
      fill="url(#g-proc)" stroke="#3a1a5f" stroke-width="1.5"
      style="cursor:pointer"/>
<text x="662" y="142" font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="#c77dff" letter-spacing="1">cnn_proc_top</text>
<text x="662" y="157" font-family="IBM Plex Mono" font-size="9" fill="#5a2a8a">Lógica de procesamiento CNN + comparador</text>

<!-- ── SC_STATEMACHINE_CNN_CTRL ── -->
<rect id="b-ctrl" x="660" y="168" width="300" height="200" rx="8"
      fill="url(#g-ctrl)" stroke="#5a3010" stroke-width="1"
      style="cursor:pointer"/>
<text x="672" y="185" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#ff8c42">SC_SM_CNN_CTRL</text>
<text x="672" y="197" font-family="IBM Plex Mono" font-size="8" fill="#7a4a20">FSM 13 estados · orquesta 2 kernels</text>
<!-- Estados clave -->
<rect x="672" y="206" width="270" height="12" rx="2" fill="#1a0a00"/>
<text x="676" y="216" font-family="IBM Plex Mono" font-size="7.5" fill="#ff8c42">IDLE→LATCH_K0→RST0→START0→WAIT0→SAVE_K0</text>
<rect x="672" y="221" width="270" height="12" rx="2" fill="#1a0a00"/>
<text x="676" y="231" font-family="IBM Plex Mono" font-size="7.5" fill="#ff8c42">    →WAIT_K1→LATCH_K1→RST1→START1→WAIT1→SAVE_K1→FINISH</text>
<!-- Señales internas del ctrl -->
<text x="672" y="248" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">in:  i_START_CNN (pulso 1 ciclo)</text>
<text x="672" y="260" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">in:  i_wgt_row00..04 → kernel_reg</text>
<text x="672" y="272" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: o_acc0, o_acc1 (16b signed)</text>
<text x="672" y="284" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">out: o_mr1_load, o_mr2_load (act.bajo)</text>
<text x="672" y="296" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: o_done (pulso fin)</text>
<text x="672" y="310" font-family="IBM Plex Mono" font-size="8" fill="#ff6b6b">    kernel_reg latched en LATCH_K0/K1</text>
<text x="672" y="322" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">    image_flat = {row09,..,row00} wire</text>
<text x="672" y="354" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">    ~108 ciclos por kernel</text>

<!-- ── cnn_top ── -->
<rect id="b-cnntop" x="990" y="168" width="340" height="360" rx="8"
      fill="url(#g-cnn)" stroke="#0a3a5a" stroke-width="1"
      style="cursor:pointer"/>
<text x="1002" y="185" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#4a9eff">cnn_top</text>
<text x="1002" y="197" font-family="IBM Plex Mono" font-size="8" fill="#1a4a6a">FSM 6 estados · 9 fragmentos · acumula</text>
<text x="1002" y="211" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">IDLE→FRAG→START→WAIT→ACC(×9)→FINISH</text>
<text x="1002" y="225" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">in: image_flat[299:0], kernel_flat[74:0]</text>
<text x="1002" y="237" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: acc[15:0] signed, done</text>

<!-- ── fragment_mux_10x10_6x6 ── -->
<rect id="b-fmux" x="1002" y="252" width="318" height="80" rx="6"
      fill="#040d14" stroke="#0a3060" stroke-width="1" style="cursor:pointer"/>
<text x="1012" y="268" font-family="IBM Plex Mono" font-size="9" font-weight="600" fill="#4a9eff">fragment_mux_10x10_6x6</text>
<text x="1012" y="280" font-family="IBM Plex Mono" font-size="8" fill="#1a4a6a">combinacional · stride=2</text>
<text x="1012" y="293" font-family="IBM Plex Mono" font-size="8" fill="#4a9eff">in:  image_flat[299:0], frag_sel[3:0]</text>
<text x="1012" y="305" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: fragment_flat[107:0]</text>
<text x="1012" y="317" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">9 fragmentos 6×6 con orígenes (0..4,0..4)</text>
<text x="1012" y="328" font-family="IBM Plex Mono" font-size="8" fill="#ffd60a">stride=2: (0,0)(0,2)(0,4)(2,0)...(4,4)</text>

<!-- ── mux_cnn ── -->
<rect id="b-mcnn" x="1002" y="348" width="318" height="165" rx="6"
      fill="url(#g-mux)" stroke="#3a1050" stroke-width="1" style="cursor:pointer"/>
<text x="1012" y="365" font-family="IBM Plex Mono" font-size="9" font-weight="600" fill="#c77dff">mux_cnn</text>
<text x="1012" y="377" font-family="IBM Plex Mono" font-size="8" fill="#5a2a8a">FSM · 4 ventanas por fragmento</text>
<text x="1012" y="391" font-family="IBM Plex Mono" font-size="8" fill="#c77dff">in: fragment_flat[107:0], kernel_flat[74:0]</text>
<text x="1012" y="403" font-family="IBM Plex Mono" font-size="8" fill="#4ade80">out: conv_out[15:0], done</text>

<!-- window_mux dentro de mux_cnn -->
<rect id="b-wmux" x="1012" y="412" width="140" height="90" rx="5"
      fill="#0d0515" stroke="#3a1060" stroke-width="1" style="cursor:pointer"/>
<text x="1020" y="427" font-family="IBM Plex Mono" font-size="8" font-weight="600" fill="#c77dff">window_mux_6x6_5x5</text>
